# Netlify: web estática, no hay nada que compilar. Se publica la carpeta tal cual.
[build]
  publish = "."

# Cabeceras básicas de seguridad para toda la web
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Las tipografías no cambian nunca: el navegador las guarda un año
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
